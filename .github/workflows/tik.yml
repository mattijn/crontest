name: Tik
on:
  schedule:
    - cron: "45 18 * * *"
      timezone: "Europe/Amsterdam"
    - cron: "50 16 * * *"          # 18:50 lokaal, maar als UTC opgeschreven
  workflow_dispatch:
jobs:
  tik:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "UTC nu     : $(date -u '+%H:%M:%S')"
          echo "event      : ${{ github.event_name }}"
          echo "schedule   : [${{ github.event.schedule }}]"
